# Set to warn to debug Log4j initialization issues
status = warn
name = SparkLog4jConfig

# Appenders - Console
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Root logger
rootLogger.level = error
rootLogger.appenderRef.stdout.ref = STDOUT

# Specific loggers for Spark/Hadoop
logger.spark.name = org.apache.spark
logger.spark.level = error

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error

# Explicitly suppress NativeCodeLoader warning
logger.nativecodeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecodeloader.level = error

# Suppress Jetty and other noisy libs
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = error

logger.netty.name = io.netty
logger.netty.level = error
